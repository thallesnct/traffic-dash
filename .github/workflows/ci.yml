name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - name: Build shared contracts
        run: npm run build -w packages/shared

      - name: Generate Prisma Client
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        run: npm run prisma:generate -w apps/api

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run format:check

      - run: npm run test

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t traffic-api:ci .

      - name: Build the web image
        run: docker build -f apps/client/Dockerfile --build-arg VITE_API_URL= -t traffic-web:ci .
